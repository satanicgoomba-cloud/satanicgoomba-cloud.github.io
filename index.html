<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeatBrawler VR</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#100722">
<style>body{background:#100722;color:#f4f0ff;font:16px system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0}</style>
</head><body><p id="l">Loading BeatBrawler…</p><script>
fetch('app.html?t=' + Date.now(), { cache: 'no-store' })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function (h) { document.open(); document.write(h); document.close(); })
  .catch(function (e) { document.getElementById('l').textContent = 'Could not load the game (' + e.message + '). Check the connection and reopen.'; });
</script></body></html>
